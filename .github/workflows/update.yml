name: Daily Sync & Modify

on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间9点（UTC 1点）
  workflow_dispatch:

jobs:
  sync-and-modify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout my-edits branch
      uses: actions/checkout@v3
      with:
        ref: my-edits
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Fetch latest config file from upstream
      run: |
        git remote add upstream https://github.com/blackmatrix7/Shadowrocket-ADBlock-Rules.git
        git fetch upstream
        git checkout upstream/main -- sr_top500_whitelist_ad.conf

    - name: Insert custom content
      run: |
        awk '/update-url/ { print; system("cat mine.txt"); next } 1' sr_top500_whitelist_ad.conf > tmp && mv tmp sr_top500_whitelist_ad.conf

    - name: Commit and Push
      run: |
        git add sr_top500_whitelist_ad.conf
        git commit -m "Auto update on $(date '+%Y-%m-%d')" || echo "No changes"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} my-edits
