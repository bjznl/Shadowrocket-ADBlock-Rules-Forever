name: Daily Sync & Modify

on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间9点（UTC 1点）
  workflow_dispatch:

jobs:
  sync-and-modify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout my-edits branch
      uses: actions/checkout@v3
      with:
        ref: my-edits
        persist-credentials: false

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Add upstream and fetch
      run: |
        git remote add upstream https://github.com/blackmatrix7/Shadowrocket-ADBlock-Rules.git
        git fetch upstream
        git merge upstream/main --allow-unrelated-histories -m "Merge upstream updates"

    - name: Insert content from mine.txt after update-url
      run: |
        awk '/update-url/ { print; system("cat mine.txt"); next } 1' sr_top500_whitelist_ad.conf > tmp.conf && mv tmp.conf sr_top500_whitelist_ad.conf
     
    - name: Commit and push changes
      run: |
        git add sr_top500_whitelist_ad.conf
        git commit -m "Auto update: insert custom config $(date '+%Y-%m-%d')" || echo "No changes to commit"
        git push origin my-edits
